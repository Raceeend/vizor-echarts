name: Build, Test, Pack, Publish

on:
  push:
    branches: [ dev ]
    tags:
      - "v*"
  pull_request:
    branches: [ dev ]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: ./global.json

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "18"

      - name: Restore .NET dependencies
        run: dotnet restore src/Vizor.ECharts.Demo.sln

      - name: Build .NET (Release)
        run: dotnet build src/Vizor.ECharts.Demo.sln --no-restore --configuration Release

      - name: Test .NET (Release)
        run: dotnet test --project src/Vizor.ECharts.Tests/Vizor.ECharts.Tests.csproj --no-build --configuration Release --logger "trx;LogFileName=test-results.trx" --results-directory ./artifacts/test-results

      - name: Install npm dependencies
        run: npm install
        working-directory: src/Vizor.ECharts

      - name: Build JS bundle with Gulp
        run: npx gulp
        working-directory: src/Vizor.ECharts

      - name: Pack NuGet (Release)
        run: dotnet pack src/Vizor.ECharts/Vizor.ECharts.csproj --configuration Release --no-build --output ./artifacts/nuget

      - name: Upload NuGet artifact
        uses: actions/upload-artifact@v5
        with:
          name: nuget-package
          path: artifacts/nuget/*.nupkg
          if-no-files-found: error

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: test-results
          path: artifacts/test-results
          if-no-files-found: ignore

      - name: Upload JS artifacts
        uses: actions/upload-artifact@v5
        with:
          name: js-bundle
          path: src/Vizor.ECharts/wwwroot/js/*.js
          if-no-files-found: error

  publish-nuget:
    name: Publish NuGet
    runs-on: ubuntu-latest
    needs: ci
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v5

      - name: Download NuGet artifact
        uses: actions/download-artifact@v5
        with:
          name: nuget-package
          path: ./artifacts/nuget

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: ./global.json

      - name: Push package to NuGet.org
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          dotnet nuget push ./artifacts/nuget/*.nupkg \
            --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
